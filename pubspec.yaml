name: music_app
description: 本地音乐播放器 + 合规在线电台发现（Flutter / Android）。
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # 状态管理
  flutter_riverpod: ^2.5.1

  # 播放器核心
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.13
  audio_service: ^0.18.15

  # 路由
  go_router: ^14.2.7

  # 本地音乐扫描
  on_audio_query: ^2.9.0

  # 数据持久化
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # HTTP & 序列化
  http: ^1.2.2
  json_annotation: ^4.9.0

  # 工具
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  uuid: ^4.5.1

  # 文件选择（LRC 手动指定）
  file_picker: ^8.1.2

  # 音频会话（来电/耳机暂停 + 通知栏增强）
  audio_session: ^0.1.21

  # 屏幕亮度控制（全屏播放页左侧上下滑）
  screen_brightness: ^0.2.2

  # AI 增强（预留，本期仅做接口与占位）
  onnxruntime: ^1.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.3
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets//